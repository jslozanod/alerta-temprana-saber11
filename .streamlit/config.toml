[theme]
base = "light"
primaryColor = "#C8102E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F1EA"
textColor = "#1F1F1F"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2.5rem", "1.9rem", "1.45rem", "1.15rem", "1rem", "0.9rem"]
metricValueFontWeight = 600
baseRadius = "0.6rem"
chartCategoricalColors = ["#C8102E", "#8A8A8A", "#1F1F1F"]

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
